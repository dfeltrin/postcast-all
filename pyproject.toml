[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-all"
version = "0.1.0"
description = "Podcast All: extract a URL and create/download a NotebookLM Audio Overview"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml_html_clean>=0.4",
  "playwright>=1.52,<1.60",
  "pypdf>=5.0,<6",
  "python-docx>=1.1,<1.2",
  "python-pptx>=1.0,<1.1",
  "trafilatura>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
news-to-audio = "news_to_audio.cli:main"
news-to-audio-download = "news_to_audio.download:main"

[tool.setuptools.packages.find]
where = ["src"]
